<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRONWALL</title>
<meta name="description" content="Монохромный терминал разведки Roblox: профили, друзья, игры, серверы, субплейсы, модерация и связи с Discord.">
<meta name="google" content="notranslate">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IRONWALL">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M16 4v24M5.6 10l20.8 12M5.6 22l20.8-12' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--pn:#111;--ln:#2b2b2b;--tx:#e8e8e8;--mu:#777;--ac:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
a{color:inherit}
header{display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.2em;text-decoration:none;display:flex;align-items:center;gap:8px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 12px;border:1px solid transparent;text-decoration:none;color:var(--mu);letter-spacing:.15em;font-size:11px}
nav a.on,nav a:hover{color:var(--ac);border-color:var(--ln)}
#cfg{margin-left:auto}
main{max-width:1240px;margin:0 auto;padding:24px}
.p{position:relative;border:1px solid var(--ln);background:var(--pn);margin-bottom:20px}
.p:before,.p:after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--ac)}
.p:before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.p:after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.p>h3{margin:0;padding:16px 20px 0;font-size:11px;letter-spacing:.3em;font-weight:500;color:var(--mu);text-transform:uppercase}
.p>small{display:block;padding:2px 20px 12px;color:var(--mu);border-bottom:1px solid var(--ln)}
.pb{padding:16px 20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.mod{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;align-items:start}
@media(max-width:860px){.g2,.mod{grid-template-columns:1fr}}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.bar label{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:11px}
input,select{flex:1;min-width:120px;background:#0a0a0a;border:1px solid var(--ln);color:var(--tx);padding:11px 13px;font:inherit;outline:0}
input[type=number]{max-width:90px;min-width:70px;flex:none}
input[type=checkbox]{flex:none;min-width:0}
input:focus,select:focus{border-color:#666}
button,.btn{background:none;border:1px solid var(--ln);color:var(--tx);padding:9px 14px;font:inherit;font-size:11px;letter-spacing:.15em;cursor:pointer;text-transform:uppercase;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--ac)}
button:disabled{opacity:.4}
.sm{padding:4px 8px;font-size:10px;letter-spacing:.1em}
.r{display:flex;justify-content:space-between;gap:16px;padding:6px 0;color:var(--mu)}
.r b{color:var(--tx);font-weight:500;text-align:right;word-break:break-all}
.msg{color:var(--mu);padding:8px 0}.err{color:#ff6b6b}.ok{color:#7dff9b}
.lbl{font-size:11px;letter-spacing:.3em;color:var(--mu);margin:0 0 8px}
.big{font-size:34px;font-weight:700}
.rate{height:6px;background:#222;margin:14px 0 6px}.rate i{display:block;height:100%;background:#fff}
.desc{white-space:pre-wrap;color:#cfcfcf;max-height:260px;overflow:auto}
.av{display:flex;gap:20px;flex-wrap:wrap}.av img{width:200px;height:200px;background:#1a1a1a;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{border:1px solid var(--ln);padding:8px;text-align:center;overflow:hidden}
.card:hover{border-color:var(--ac)}.card img{width:100%;aspect-ratio:1;background:#1a1a1a;cursor:pointer}
.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.card button{margin-top:6px;width:100%}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:.25em;color:var(--mu);text-align:left;font-weight:500;padding:10px 14px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #1a1a1a;vertical-align:middle}
.tag{border:1px solid var(--ln);padding:2px 8px;font-size:11px;margin:2px;display:inline-block;cursor:pointer}
canvas{width:100%;height:460px;background:#0a0a0a;display:block}
.hit td{background:#222}
.sp{background:#0a0a0a;border:1px solid var(--ln);height:150px;position:relative;margin:12px 0}.sp svg{width:100%;height:100%;display:block}
.spl{position:absolute;right:6px;font-size:10px;color:var(--mu);font-style:normal}.spl.t{top:3px}.spl.b{bottom:3px}
button.on{background:#fff;color:#000;border-color:#fff}
.p>small:not(#scnt):not(.keep),.msg[style*="font-size:11px"]:not(.err):not(#sprog),#chg{display:none}
.p>small.keep{color:var(--tx)}
.cc{white-space:nowrap}.cc.na{color:var(--mu)}
#scnt{color:var(--tx);font-size:12px}.p>h3{color:#fff;font-size:12px}.p>h3+.pb{padding-top:12px}
.clk{cursor:pointer}.clk:hover td{background:#181818}
.avs{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px;max-width:360px}
.avs img,.avs i{width:30px;height:30px;background:#1a1a1a;display:block}
.avs img.me{outline:2px solid #fff}
.jid{font-size:11px;word-break:break-all;color:#cfcfcf}
.ico{width:44px;height:44px;background:#1a1a1a;display:block}
.verdict{font-size:20px;font-weight:700;letter-spacing:.1em;padding:14px;border:1px solid var(--ln);text-align:center;margin-bottom:14px}
.verdict.bad{border-color:#ff6b6b;color:#ff6b6b}.verdict.good{border-color:#7dff9b;color:#7dff9b}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;display:none;z-index:9;font-size:12px}
h2.t{letter-spacing:.1em;margin:0 0 14px;font-size:20px}
.sk{background:linear-gradient(90deg,#161616,#262626,#161616);background-size:200% 100%;animation:skl 1.2s linear infinite;color:transparent!important;border-color:transparent!important}
@keyframes skl{to{background-position:-200% 0}}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-4px 0 14px}.chips:empty{display:none}
.chips .tag{margin:0}
body{background:var(--bg)}
header{background:rgba(11,11,11,.82);backdrop-filter:blur(10px)}
.logo{transition:.2s}.logo:hover{letter-spacing:.3em}
nav a{transition:.15s}nav a.on{background:#fff;color:#000;border-color:#fff}nav a:hover:not(.on){background:#181818}
.p{animation:fi .35s ease both;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:border-color .2s}.p:hover{border-color:#3d3d3d}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
button,.btn,.tag{transition:background .15s,color .15s,border-color .15s}
button:hover:not(:disabled):not(.on),.btn:hover,a.tag:hover{background:#fff;color:#000;border-color:#fff}
button:disabled{cursor:default}
input:focus,select:focus,textarea:focus{border-color:#888;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.card{transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-3px)}
.card img{border-bottom:1px solid var(--ln)}
tbody tr{transition:background .12s}tbody tr:hover td{background:#171717}
.av img,#pimg{border:1px solid var(--ln)}
.r{border-bottom:1px dashed #1d1d1d}.r:last-child{border-bottom:0}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#0b0b0b}::-webkit-scrollbar-thumb{background:#2c2c2c}::-webkit-scrollbar-thumb:hover{background:#444}
#toast{box-shadow:0 6px 24px rgba(0,0,0,.5);letter-spacing:.05em}
textarea{outline:0}
::selection{background:#fff;color:#000}

html{background:#070707}
body{background:transparent!important}
#bgfx{position:fixed;inset:0;width:100%;height:100%!important;z-index:-2;background:none;pointer-events:none}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 78%);mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 78%);animation:gd 40s linear infinite}
body:after{content:"";position:fixed;left:50%;top:-260px;width:1100px;height:620px;max-width:140vw;transform:translateX(-50%);z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(255,255,255,.13),rgba(255,255,255,.05) 55%,transparent);filter:blur(30px);animation:glow 9s ease-in-out infinite alternate}
@keyframes gd{to{background-position:56px 56px,56px 56px}}@keyframes glow{from{opacity:.75}to{opacity:1}}
.p{background:rgba(16,16,16,.78);backdrop-filter:blur(6px)}
header{background:rgba(8,8,8,.8)}
.logo{background:linear-gradient(90deg,#fff,#888 60%,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 6s linear infinite}
.logo svg{-webkit-text-fill-color:initial}@keyframes sh{to{background-position:-200%}}
.pc{cursor:pointer;text-align:left;padding:10px;display:flex;flex-direction:column;gap:4px}.pc img,.pc .sk{width:100%;aspect-ratio:1}
.pc b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc .ps{font-size:11px;color:var(--mu);line-height:1.6}.pc .ps i{font-style:normal;color:var(--tx)}
.grid.pin{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.rx{font-size:40px;font-weight:700}

/* ===== NAV: выпадающие категории ===== */
#nav{align-items:center;gap:6px}
.grp{position:relative}
.grp>.gl{display:flex;align-items:center;cursor:pointer;user-select:none}
.car{display:inline-block;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-left:9px;position:relative;top:-2px;transition:transform .2s}
.grp.dd-open .car{transform:rotate(-135deg);top:1px}
.dd{position:absolute;top:calc(100% + 8px);left:0;min-width:210px;padding:6px;background:rgba(10,10,10,.97);border:1px solid var(--ln);box-shadow:0 18px 40px rgba(0,0,0,.6);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:2px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s,transform .18s,visibility .18s;z-index:20}
.dd:before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.dd a{display:block;padding:9px 14px;border:1px solid transparent;color:var(--mu);text-decoration:none;font-size:11px;letter-spacing:.15em;white-space:nowrap;transition:background .12s,color .12s}
.dd a:hover{background:#1a1a1a;color:#fff}
.dd a.on{background:#fff;color:#000}
.grp.dd-open>.dd{opacity:1;visibility:visible;transform:none}
@media(hover:hover){.grp.multi:hover>.dd{opacity:1;visibility:visible;transform:none}.grp.multi:hover .car{transform:rotate(-135deg);top:1px}}
nav a.gl.on{background:#fff;color:#000;border-color:#fff}
@media(max-width:700px){header{padding:10px 14px;gap:10px}.dd{position:fixed;left:12px;right:12px;top:auto;min-width:0}}

/* ===== CHAT: 3 колонки ===== */
#app.wide{max-width:1560px;padding:14px 20px}
.chat{position:relative;display:grid;grid-template-columns:268px minmax(0,1fr) 248px;height:calc(100vh - 104px);min-height:500px;border:1px solid var(--ln);background:rgba(13,13,13,.86);backdrop-filter:blur(6px);overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#cs,#cmem{display:flex;flex-direction:column;min-height:0;background:rgba(9,9,9,.9)}
#cs{border-right:1px solid var(--ln)}#cmem{border-left:1px solid var(--ln)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px;border-bottom:1px solid var(--ln);min-height:52px;flex-wrap:wrap}
.sh b{letter-spacing:.2em;font-size:11px;text-transform:uppercase}
.sh .tb{display:flex;gap:4px;flex-wrap:wrap}
.sl{flex:1;min-height:0;overflow:auto;padding:8px}
.ci,.ch{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid transparent}
.ci{color:var(--mu);transition:background .12s,color .12s}
.ci:hover{background:#171717;color:#fff}
.ci.on{background:#fff;color:#000}
.ci span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci i{font-style:normal;opacity:0;padding:0 4px;transition:opacity .12s}.ci:hover i,.ci.on i{opacity:.8}
.ci i:hover{opacity:1}
.ch{font-size:10px;letter-spacing:.2em;color:var(--mu);margin-top:12px;text-transform:uppercase;transition:color .12s}
.ch:hover{color:#fff}
.ch .cr{display:inline-block;width:10px;transition:transform .18s}
.cg.col .ch .cr{transform:rotate(-90deg)}
.cg.col .ci:not(.on){display:none}
.cg{min-height:8px}
.su{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--ln)}
.su .un{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cm{display:flex;flex-direction:column;min-width:0;min-height:0}
.ctop{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px;border-bottom:1px solid var(--ln)}
.ctop b{white-space:nowrap}.ctop .topic{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;border-left:1px solid var(--ln);padding-left:12px}
.ctop .mb{display:none}
#ml{flex:1;min-height:0;overflow:auto;padding:14px 18px 6px}
.mg{display:flex;gap:12px;padding:2px 8px;margin:0 -8px;position:relative;word-break:break-word}
.mg:hover{background:rgba(255,255,255,.035)}
.mg.first{margin-top:12px}
.mg .gut{width:38px;flex:none}
.mg .body{min-width:0;flex:1}
.mg .hd{display:flex;gap:8px;align-items:baseline}
.mg .hd b{font-weight:700}.mg .hd small{color:var(--mu);font-size:10px}
.mg .tx{white-space:pre-wrap;color:#d6d6d6}
.mg .tx img{max-width:min(360px,100%);display:block;margin-top:6px;border:1px solid var(--ln);cursor:zoom-in}
.mg .act{position:absolute;right:8px;top:2px;opacity:0}.mg:hover .act{opacity:1}
.avt{position:relative;width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;background:#1a1a1a;border:1px solid var(--ln);font-weight:700;color:#cfcfcf}
.avt.ad{background:#fff;color:#000;border-color:#fff}
.dsep{display:flex;align-items:center;gap:12px;margin:16px 0 4px;color:var(--mu);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.dsep:before,.dsep:after{content:"";flex:1;height:1px;background:var(--ln)}
.fp{border:1px solid var(--ln);padding:12px 14px;margin:8px 0;cursor:pointer;transition:border-color .15s,background .15s}
.fp:hover{border-color:#fff;background:#151515}.fp b{display:block;margin-bottom:2px}.fp small{color:var(--mu)}
.comp{display:flex;gap:8px;align-items:flex-end;padding:10px 16px 14px;flex-wrap:wrap}
.comp input,.comp textarea{flex:1;min-width:140px}
.comp textarea{background:#0a0a0a;border:1px solid var(--ln);color:var(--tx);padding:11px 13px;font:inherit;resize:none;max-height:140px;line-height:1.4}
.comp textarea:disabled{opacity:.5}
#me{padding:0 18px;min-height:0}
.mh{font-size:10px;letter-spacing:.2em;color:var(--mu);padding:14px 8px 6px;text-transform:uppercase}
.mu{display:flex;align-items:center;gap:10px;padding:5px 8px;color:var(--mu);transition:background .12s}
.mu:hover{background:#171717}
.mu .avt{width:30px;height:30px;font-size:12px}
.mu span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu.on{color:var(--tx)}.mu.bn span{text-decoration:line-through;opacity:.5}
.dot{position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:50%;background:#444;border:2px solid #0b0b0b}
.mu.on .dot{background:#7dff9b}
.hint{font-size:10px;color:var(--mu);padding:10px 8px;line-height:1.6}
.auth{max-width:420px;margin:8vh auto 0}
.auth h2{margin:0 0 4px;letter-spacing:.2em}.auth .bar{flex-direction:column;align-items:stretch}.auth .bar>*{width:100%}
@media(max-width:1100px){.chat{grid-template-columns:240px minmax(0,1fr)}#cmem{position:absolute;top:0;bottom:0;right:0;width:min(280px,88%);z-index:6;transform:translateX(100%);transition:transform .25s;border-left:1px solid #444}.chat.r #cmem{transform:none}.ctop .mb.rb{display:inline-block}}
@media(max-width:760px){.chat{grid-template-columns:1fr;height:calc(100vh - 92px)}#cs{position:absolute;top:0;bottom:0;left:0;width:min(300px,88%);z-index:6;transform:translateX(-100%);transition:transform .25s;border-right:1px solid #444}.chat.l #cs{transform:none}.ctop .mb{display:inline-block}#app.wide{padding:8px}}

/* ===== контекстное меню / диалоги / профиль ===== */
#cctx{position:fixed;z-index:60;min-width:220px;max-width:300px;padding:6px;background:rgba(10,10,10,.98);border:1px solid var(--ln);box-shadow:0 18px 40px rgba(0,0,0,.7);animation:fi .12s ease both}
#cctx hr{border:0;border-top:1px solid var(--ln);margin:5px 4px}
.cmi{display:flex;justify-content:space-between;gap:16px;padding:8px 12px;cursor:pointer;font-size:12px;color:var(--tx);white-space:nowrap}
.cmi small{color:var(--mu);font-size:10px}
.cmi:hover{background:#fff;color:#000}.cmi:hover small{color:#444}
.cmi.dng{color:#ff6b6b}.cmi.dng:hover{background:#ff6b6b;color:#000}
.cmi.lbl{color:var(--mu);font-size:10px;letter-spacing:.2em;cursor:default;text-transform:uppercase}.cmi.lbl:hover{background:none;color:var(--mu)}
.rni{width:100%;padding:2px 6px;background:#000;border:1px solid #fff;color:#fff;font:inherit;min-width:0}
.ovl{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ovl .p{width:100%;max-width:440px;margin:0}
.pfh{display:flex;gap:16px;align-items:center;padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid var(--ln)}
.avt.big{width:72px;height:72px;font-size:28px}
.pfn{font-size:18px;font-weight:700;word-break:break-all}
.pn{cursor:pointer}.hd b.pn:hover{text-decoration:underline}
.mu{cursor:pointer}
.pfa{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.pfa label{display:flex;gap:4px;align-items:center;color:var(--mu);font-size:11px}
#cs .ci,#cs .ch,.mu,.mg{-webkit-touch-callout:none}

/* ===== серо-чёрный стиль чата: чёрные кнопки с белой обводкой ===== */
.chat button,.ovl button,#cmod button,#cctx button{background:#000;color:#fff;border:1px solid #fff}
.chat button:hover:not(:disabled),.ovl button:hover:not(:disabled),#cmod button:hover:not(:disabled){background:#1c1c1c;color:#fff;border-color:#fff}
.chat button:disabled,.ovl button:disabled{border-color:#444;color:#777;background:#000}
.ovl button.on,.chat button.on{background:#000;color:#fff;border-color:#fff}
.ci.on{background:#1c1c1c;color:#fff;border-color:#fff}
.ci:hover{background:#161616;color:#fff}
.avt.ad{background:#000;color:#fff;border-color:#fff}
.cmi:hover{background:#1c1c1c;color:#fff;box-shadow:inset 0 0 0 1px #fff}.cmi:hover small{color:#999}
.cmi.dng:hover{background:#1f1010;color:#ff6b6b;box-shadow:inset 0 0 0 1px #ff6b6b}
.dd a.on{background:#1c1c1c;color:#fff;border-color:#fff}
.chat input:focus,.chat textarea:focus,.ovl input:focus,.ovl textarea:focus,.ovl select:focus{border-color:#fff}
.mg .tx a{color:#fff;text-decoration:underline}
.wl{border:1px dashed var(--ln);padding:12px 14px;margin:4px 0 8px;color:var(--mu);white-space:pre-wrap}
/* ===== окна настроек ===== */
.sv{display:grid;grid-template-columns:210px minmax(0,1fr);width:min(1000px,100%);height:min(88vh,740px);border:1px solid var(--ln);background:#0b0b0b;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:fi .2s ease both}
.svn{border-right:1px solid var(--ln);padding:14px 10px;display:flex;flex-direction:column;gap:3px;background:#090909;overflow:auto}
.svn .lbl{padding:0 10px 10px;letter-spacing:.2em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},
  s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const fmt = n => n==null ? '—' : Number(n).toLocaleString('ru-RU');
const dt = s => s ? new Date(s).toLocaleDateString('ru-RU') : '—';
const KEEP = /^(найдено|всего|.*\d+ друзей)/;
const panel = (t,sub,body) => `<section class="p"><h3>${t}</h3>${sub&&KEEP.test(sub)?`<small class="keep">${sub}</small>`:''}<div class="pb">${body}</div></section>`;
const row = (k,v) => `<div class="r"><span>${k}</span><b>${v}</b></div>`;
const val = (r,f,d='—') => r.status==='fulfilled' ? f(r.value) : d;
const post = body => ({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const sleep = ms => new Promise(r => setTimeout(r, ms));


const DB = 'https://robotrace-d4230-default-rtdb.firebaseio.com';
async function dbReq(path, method, body, q=''){
  const ac = new AbortController(), tm = setTimeout(()=>ac.abort(), 6000);
  try{
    const r = await fetch(`${DB}/${path}.json${q}`, {method, signal:ac.signal, body: body===undefined ? undefined : JSON.stringify(body)});
    if (!r.ok) throw new Error('DB HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(tm); }
}
const dbGet = (p,q) => dbReq(p,'GET',undefined,q);
const dbPush = (p,v) => dbReq(p,'POST',v).catch(()=>null);
const errBox = (el,m) => { el.innerHTML = `<div class="msg err">Ошибка: ${esc(m)}</div><button onclick="route()">Повторить</button>`; };
async function retry(fn, n){ for (let i=0;;i++){ try{ return await fn(); }catch(e){ if (i>=n-1) throw e; await sleep(1200*(i+1)); } } }
const joinUrl = (place, job) => `roblox://experiences/start?placeId=${place}${job?'&gameInstanceId='+job:''}`;
function toast(t){ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',1500); }
function cp(t){
  const done=()=>toast('Скопировано');
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done,()=>fb()); else fb();
  function fb(){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch{} a.remove(); done(); }
}


const CAND = [
  (s,p) => `https://${s}.roproxy.com${p}`,
  (s,p) => `https://${s}.rotunnel.com${p}`,
  (s,p) => `https://corsproxy.io/?url=${encodeURIComponent(`https://${s}.roblox.com${p}`)}`,
  (s,p) => `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://${s}.roblox.com${p}`)}`
];
let okIdx = 0;
const QMAX = 4; let qRun = 0; const qWait = [];
const qAcq = () => new Promise(res => { const go = () => { if (qRun < QMAX){ qRun++; res(); } else qWait.push(go); }; go(); });
const qRel = () => { qRun--; const n = qWait.shift(); if (n) n(); };
const GCACHE = new Map();
async function api(sub, path, o){
  const isGet = !(o && o.method && o.method!=='GET'), key = sub+path;
  if (isGet){ const c = GCACHE.get(key); if (c && Date.now()-c.t < 60000) return c.v; }
  await qAcq();
  try{
    let v;
    try{ v = await api1(sub, path, o); }catch(e){ await sleep(1500); v = await api1(sub, path, o); }
    if (isGet) GCACHE.set(key, {t:Date.now(), v});
    return v;
  } finally { qRel(); }
}
async function api1(sub, path, o){
  if (window.BANNED) throw new Error('Доступ запрещён');
  const full = `https://${sub}.roblox.com${path}`, c = [];
  if (workerOn()) c.push(() => workerUrl(full));
  CAND.forEach((f,ix) => { if (!(o && o.method==='POST' && ix===3)) c.push(() => f(sub,path)); });
  let err;
  for (let k=0;k<c.length;k++){
    const i = (okIdx+k)%c.length;
    try{
      const r = await fetch(c[i](), {...o, headers:{'Accept-Language':'en-US,en;q=0.9', ...(o&&o.headers)}});
      if (r.ok){ okIdx = i; return await r.json(); }
      if (r.status===429) await sleep(1500);
      err = new Error('HTTP '+r.status);
    }catch(e){ err = e; }
  }
  throw new Error('Roblox сейчас не отвечает. Попробуйте ещё раз чуть позже.');
}
const WORKER = 'https://curly-heart-cb26.lvlyvcbcla.workers.dev/';
function workerOn(){ return true; }
function workerUrl(full){ const u = new URL(WORKER); u.searchParams.set('url', full); return u.toString(); }
const IPW = 'https://robotrace.lvlyvcbcla.workers.dev/';
function wBase(){ try{ return new URL(IPW); }catch{ return null; } }
async function wApi(path, o={}){
  const b = wBase(); if (!b) throw new Error('worker');
  const h = {}; if (o.admin){ const k = ls.g('adminKey',''); if (k) h['X-Admin-Key'] = k; } if (o.body) h['Content-Type'] = 'application/json';
  const r = await fetch(new URL(path, b), {method:o.method||'GET', headers:h, body:o.body?JSON.stringify(o.body):undefined});
  const j = await r.json().catch(()=>({}));
  if (r.status===403 && j.error==='banned') showBan(j.reason);
  if (!r.ok) throw new Error(j.error || 'HTTP '+r.status);
  return j;
}
function showBan(reason){
  window.BANNED = true; if ($('#banov')) return;
  const d = document.createElement('div'); d.id = 'banov';
  d.style.cssText = 'position:fixed;inset:0;z-index:99;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;text-align:center;padding:20px';
  d.innerHTML = `<h2 style="margin:0 0 10px">ДОСТУП ЗАПРЕЩЁН</h2><div class="msg">${esc(reason||'Ваш IP заблокирован')}</div>`;
  document.body.appendChild(d);
}

async function resolveUser(q){
  q = String(q||'').trim();
  if (!q) throw new Error('Введите ник или ID');
  if (/^\d+$/.test(q)) return api('users','/v1/users/'+q);
  const r = await api('users','/v1/usernames/users', post({usernames:[q],excludeBannedUsers:false}));
  if (!r.data[0]) throw new Error('Игрок не найден');
  return api('users','/v1/users/'+r.data[0].id);
}
async function heads(ids){
  const m = {};
  for (let i=0;i<ids.length;i+=100){
    try{
      const r = await api('thumbnails',`/v1/users/avatar-headshot?userIds=${ids.slice(i,i+100).join()}&size=150x150&format=Png`);
      (r.data||[]).forEach(d => m[d.targetId] = d.imageUrl);
    }catch{}
  }
  return m;
}
async function headOf(id){
  for (let i=0;i<5;i++){
    const d = (await api('thumbnails',`/v1/users/avatar-headshot?userIds=${id}&size=150x150&format=Png&isCircular=false`)).data[0];
    if (d && d.imageUrl) return d.imageUrl;
    if (d && d.state==='Blocked') break;
    await sleep(800);
  }
  throw new Error('Roblox не отдал аватарку игрока (Pending/Blocked)');
}
const placeToUniverse = async id => (await api('apis',`/universes/v1/places/${id}/universe`)).universeId;


const imgKey = u => { try{ const x = new URL(u); if (x.hostname.toLowerCase().endsWith('rbxcdn.com')) return x.pathname.split('/').filter(Boolean)[0]?.toLowerCase() || ''; }catch{} return String(u||'').split('?')[0].toLowerCase(); };
window.AVSTAT = {ok:0, empty:0, fail:0, last:'', state:''};
let TOKTYPE = 'AvatarHeadShot';
const tokReq = t => ({requestId:`0:${t}:AvatarHeadshot:150x150:png:regular`,type:TOKTYPE,targetId:0,token:t,format:'png',size:'150x150',isCircular:false});
const tokOf = (d, c, i) => { const p = String(d.requestId||'').split(':')[1]; return c.includes(p) ? p : c[i]; };
async function tokBatch(c, cache, pend, flipped){
  const r = await api('thumbnails','/v1/batch', post(c.map(tokReq)));
  const data = r.data||[];
  if (data[0]) AVSTAT.raw = JSON.stringify(data[0]).slice(0,220);
  if (!flipped && data.length && data.every(d => !d.imageUrl && d.state==='Error')){
    TOKTYPE = TOKTYPE==='AvatarHeadShot' ? 'AvatarHeadshot' : 'AvatarHeadShot';
    return tokBatch(c, cache, pend, true);
  }
  const returned = new Set();
  data.forEach((d,i) => {
    const t = tokOf(d, c, i);
    if (!t) return;
    returned.add(t);
    if (d.imageUrl){ cache[t] = d.imageUrl; AVSTAT.ok++; }
    else { pend.push(t); AVSTAT.empty++; AVSTAT.state = d.state||''; }
  });
  c.forEach(t => { if (!returned.has(t) && !cache[t]) pend.push(t); });
}
async function tokAv(tokens, cache){
  const need = [...new Set(tokens)].filter(t => !cache[t]), ch = [], pend = [];
  for (let i=0;i<need.length;i+=100) ch.push(need.slice(i,i+100));
  for (let i=0;i<ch.length;i+=2){
    await Promise.all(ch.slice(i,i+2).map(c => tokBatch(c, cache, pend).catch(e => { AVSTAT.fail++; AVSTAT.last = e.message; })));
  }
  for (let r=0; r<3 && pend.length; r++){
    await sleep(1200*(r+1)); const cur = pend.splice(0);
    for (let i=0;i<cur.length;i+=100) await tokBatch(cur.slice(i,i+100), cache, pend).catch(()=>{});
  }
}


const sess = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random());
async function exploreSort(sortId, pages){
  const sid = sess(), out = []; let tok = '';
  for (let i=0;i<pages;i++){
    const r = await api('apis',`/explore-api/v1/get-sort-content?sessionId=${sid}&sortId=${encodeURIComponent(sortId)}&device=computer&country=all&cpuCores=8&maxResolution=1920x1080&maxMemory=8192&networkType=4g${tok?'&pageToken='+encodeURIComponent(tok):''}`);
    (r.games||[]).forEach(g => out.push(normGame(g)));
    tok = r.nextPageToken; if (!tok) break;
  }
  return out;
}
async function omniSearch(q, pages){
  const sid = sess(), out = []; let tok = '';
  for (let i=0;i<pages;i++){
    const r = await api('apis',`/search-api/omni-search?searchQuery=${encodeURIComponent(q)}&pageToken=${encodeURIComponent(tok)}&sessionId=${sid}&pageType=all`);
    (r.searchResults||[]).forEach(sr => (sr.contents||[]).forEach(c => { if (c.universeId) out.push(normGame(c)); }));
    tok = r.nextPageToken; if (!tok) break;
  }
  return out;
}
const normGame = c => ({u:c.universeId, n:c.name, on:c.playerCount ?? c.playing ?? 0, up:c.totalUpVotes ?? 0, dn:c.totalDownVotes ?? 0, pl:c.rootPlaceId, d:''});
async function topGames(n){
  const per = Math.ceil(n/20)+1;
  return (await exploreSort('top-playing-now', Math.min(per,10))).slice(0,n);
}


const TABS = [['profile','ПРОФИЛИ'],['friends','ДРУЗЬЯ'],['mod','МОДЕРАЦИЯ'],['charts','CHARTS'],['game','ИГРА'],['blox','BLOXLINK'],['links','ССЫЛКИ'],['ids','ID'],['join','ВХОД'],['robux','КУРС ROBUX'],['market','МАРКЕТПЛЕЙС'],['compare','СРАВНЕНИЕ'],['fav','ЗАКРЕПЛЁННЫЕ']];
window.CUR = null; window.AUTO = false;
function rsPush(u){ try{ dbReq('tracked/'+u.id,'PUT',{t:Date.now()}).catch(()=>null); }catch{}  let l = ls.g('rsearch',[]).filter(x=>x.id!=u.id); l.unshift({id:u.id,n:u.name,t:Date.now()}); ls.s('rsearch', l.slice(0,30)); }
function rsRender(){
  const b = $('#rs'); if (!b) return;
  const l = ls.g('rsearch',[]);
  b.innerHTML = l.length ? '<span class="msg">Ваши поиски:</span>' + l.slice(0,14).map(x=>`<a class="tag" onclick="act(window.TABCUR||'profile','${x.id}')">${esc(x.n)}</a>`).join('') + '<button class="sm" onclick="ls.s(\'rsearch\',[]);rsRender()">очистить</button>' : '';
}
function goto(tab, arg){
  const h = `#/${tab}/${encodeURIComponent(arg||'')}`;
  if (location.hash === h) route(); else location.hash = h;
}
function route(){
  closeModal(); clearInterval(window.GT); clearInterval(window.SA); clearInterval(window.PA); if (window.SCAN) window.SCAN.abort();
  const h = location.hash.replace(/^#\//,''), i = h.indexOf('/');
  const tab = (i<0?h:h.slice(0,i)) || 'main', arg = decodeURIComponent(i<0?'':h.slice(i+1));
  window.TABCUR = tab; renderNav(tab); $('#app').classList.toggle('wide', tab==='main');
  ({main:pgMain,profile:pgProfile,friends:pgFriends,mod:pgMod,charts:pgCharts,game:pgGame,blox:pgBlox,links:pgLinks,ids:pgIds,join:pgJoin,robux:pgRobux,fav:pgFav,market:pgMarket,compare:pgCompare}[tab] || pgProfile)(arg);
  window.scrollTo(0,0);
}

/* ===== ФОНОВЫЙ СБОР АКТИВНОСТИ И СЛЕЖЕНИЕ ===== */
const PTYPE = ['офлайн','онлайн','в игре','в Studio','невидим'];
const watchList = () => ls.g('watch', []);
const watchHas = id => watchList().some(x => String(x.id)===String(id));
async function presBatch(ids){
  const r = await api('presence','/v1/presence/users', post({userIds:ids.map(Number)}));
  return r.userPresences||[];
}
function slotsFrom(p, now){
  const w = {};
  if (p.userPresenceType > 0) w[slotOf(now)] = 1;
  else if (p.lastOnline){ const t = Date.parse(p.lastOnline); if (t && now-t < 7*864e5) w[slotOf(t)] = 1; }
  return w;
}
async function saveActivity(list){
  const now = Date.now();
  await Promise.all(list.map(p => { const w = slotsFrom(p, now); return Object.keys(w).length ? dbReq('activity/'+p.userId, 'PATCH', w).catch(()=>null) : null; }));
}
/* Фон: пока сайт открыт у кого угодно, каждый клиент берёт случайные 100 из всех искавшихся игроков */
let BGIDS = [], BGT = 0;
async function bgCycle(){
  try{
    if (Date.now()-BGT > 30*60000 || !BGIDS.length){ const r = await dbGet('tracked','?shallow=true'); BGIDS = Object.keys(r||{}); BGT = Date.now(); }
    const pool = BGIDS.slice().sort(() => Math.random()-.5).slice(0, 100);
    for (let i=0;i<pool.length;i+=50){ const l = await presBatch(pool.slice(i,i+50)); await saveActivity(l); }
    window.BGINFO = `фон: игроков в базе ${BGIDS.length}, проверено ${pool.length}`;
  }catch(e){ window.BGINFO = 'фон: ошибка '+(e.message||''); }
}
setTimeout(() => { bgCycle(); setInterval(bgCycle, 5*60000); }, 8000);
/* Следить: личный список с быстрым опросом */
const WST = {};
function watchToggle(id, n, btn){
  let l = watchList();
  if (watchHas(id)){ l = l.filter(x => String(x.id)!==String(id)); toast('Слежение выключено'); if (btn) btn.textContent = 'Следить'; }
  else { l.push({id:String(id), n}); toast('Слежу за '+n); if (btn) btn.textContent = 'Не следить'; try{ if (window.Notification && Notification.permission==='default') Notification.requestPermission(); }catch{} }
  ls.s('watch', l); watchRestart(); watchTick();
}
async function watchTick(){
  const l = watchList(); if (!l.length){ if (window.WRENDER && $('#wbox')) renderWatch(); return; }
  try{
    for (let i=0;i<l.length;i+=50){
      const ps = await presBatch(l.slice(i,i+50).map(x=>x.id)); await saveActivity(ps);
      ps.forEach(p => {
        const x = l.find(y => String(y.id)===String(p.userId)), old = WST[p.userId];
        const st = {t:p.userPresenceType, loc:p.lastLocation||'', pl:p.rootPlaceId||p.placeId||'', lo:p.lastOnline||'', at:Date.now()};
        if (old && (old.t!==st.t || (st.t===2 && old.pl!==st.pl))){
          const msg = `${x?x.n:p.userId}: ${PTYPE[st.t]||'?'}${st.loc?' · '+st.loc:''}`;
          toast(msg); try{ if (window.Notification && Notification.permission==='granted') new Notification('IRONWALL', {body:msg}); }catch{}
        }
        WST[p.userId] = st;
      });
    }
  }catch{}
  if ($('#wbox')) renderWatch();
}
function watchInt(v){ ls.s('wint', +v); watchRestart(); }
function watchRestart(){ clearInterval(window.WT); if (watchList().length) window.WT = setInterval(watchTick, Math.max(15, +ls.g('wint',60))*1000); }
function renderWatch(){
  const b = $('#wbox'); if (!b) return; const l = watchList();

const SLOT = 1800000, WEEK = 336;
const slotOf = t => String(Math.floor(t/SLOT));
async function activityTrack(id){
  clearInterval(window.PA);

    try{
      const r = await api('presence','/v1/presence/users', post({userIds:[+id]}));
      const p = (r.userPresences||[])[0]; if (!p) return;
      const now = Date.now(), w = {};
      if (p.userPresenceType > 0) w[slotOf(now)] = 1;
      else if (p.lastOnline){ const t = Date.parse(p.lastOnline); if (t && now - t < 7*864e5) w[slotOf(t)] = 1; }
      dbReq('tracked/'+id, 'PUT', {t:now}).catch(()=>null);
      if (Object.keys(w).length) dbReq('activity/'+id, 'PATCH', w).catch(()=>null);
    }catch{}
  };
  tick(); window.PA = setInterval(tick, 300000);
}
const TZNAMES = {'-8':'США, Канада (Тихоокеанское)','-7':'США, Канада (Горное)','-6':'США, Мексика, Центральная Америка','-5':'США, Канада (Восток), Колумбия, Перу','-4':'Венесуэла, Чили, Боливия','-3':'Бразилия, Аргентина, Уругвай','-2':'Атлантика','-1':'Азорские о-ва, Кабо-Верде','0':'Великобритания, Португалия, Ирландия','1':'Германия, Франция, Польша, Испания, Италия','2':'Украина, Финляндия, Румыния, Израиль, Египет, ЮАР','3':'Россия (Москва), Беларусь, Турция, Саудовская Аравия','4':'ОАЭ, Азербайджан, Армения, Грузия','5':'Узбекистан, Пакистан, Казахстан (запад)','6':'Казахстан, Киргизия, Бангладеш','7':'Таиланд, Вьетнам, Индонезия','8':'Китай, Филиппины, Малайзия, Сингапур','9':'Япония, Южная Корея','10':'Австралия (восток)','11':'Соломоновы о-ва','12':'Новая Зеландия'};
async function countryFromActivity(id){
  const cur = Math.floor(Date.now()/SLOT);
  const r = await dbGet('activity/'+id, `?orderBy="$key"&startAt="${cur-WEEK}"`);
  const keys = Object.keys(r||{}).map(Number).filter(k => k>cur-WEEK && k<=cur);
  const days = new Set(keys.map(k => Math.floor(k*SLOT/864e5)));
  if (keys.length < 20 || days.size < 3) return 'Информация не обновлена';
  const H = new Array(48).fill(0);
  keys.forEach(k => { H[k % 48]++; });
  const n = 16; let best = 0, bi = 0;
  for (let i=0;i<48;i++){ let t = 0; for (let j=0;j<n;j++) t += H[(i+j)%48]; if (i===0 || t < best){ best = t; bi = i; } }
  const avg = H.reduce((a,b)=>a+b,0) * n / 48;
  if (best > avg*0.45) return 'Информация не обновлена';
  const centerUtc = ((bi + n/2) % 48) / 2;
  let off = Math.round(4.5 - centerUtc); while (off > 12) off -= 24; while (off < -11) off += 24;
  const nm = TZNAMES[String(off)];
  if (!nm) return 'Информация не обновлена';
  return `≈ UTC${off>=0?'+':''}${off} · ${esc(nm)} <span class="msg">по времени онлайна за неделю</span>`;
}

async function scanGame(place, target, pages, sg){
  let cursor = '';
  for (let p=0;p<pages;p++){
    if (sg.aborted) return null;
    const r = await api('games',`/v1/games/${place}/servers/Public?limit=100${cursor?'&cursor='+encodeURIComponent(cursor):''}`);
    const byTok = {}; r.data.forEach(s => (s.playerTokens||[]).forEach(t => byTok[t] = s));
    const toks = Object.keys(byTok);
    for (let i=0;i<toks.length;i+=100){
      if (sg.aborted) return null;
      const c = toks.slice(i,i+100);
      const rr = await api('thumbnails','/v1/batch', post(c.map(tokReq))).catch(()=>({data:[]}));
      const h = (rr.data||[]).find(d => d.imageUrl && imgKey(d.imageUrl) === imgKey(target));
      if (h) return byTok[tokOf(h, c, rr.data.indexOf(h))];
    }
    cursor = r.nextPageCursor; if (!cursor) break;
  }
  return null;
}
async function startScan(uid){
  if (window.SCAN) window.SCAN.abort();
  const ac = window.SCAN = new AbortController(), sg = ac.signal, prog = $('#sprog'), res = $('#sres');
  const n = +$('#scn').value || 0, pages = +$('#scp').value || 1;
  res.innerHTML = ''; prog.textContent = 'собираю список игр…';
  try{
    const target = await headOf(uid);
    const cand = new Map(), add = (p,nm) => { if (p && !cand.has(String(p))) cand.set(String(p), nm || p); };
    const [mine,fav,top] = await Promise.allSettled([
      api('games',`/v2/users/${uid}/games?limit=50`),
      api('games',`/v2/users/${uid}/favorite/games?limit=50`),
      n ? topGames(n) : Promise.resolve([])
    ]);
    if (mine.status==='fulfilled') mine.value.data.forEach(g => add(g.rootPlace?.id, g.name));
    if (fav.status==='fulfilled') fav.value.data.forEach(g => add(g.rootPlace?.id, g.name));
    if (top.status==='fulfilled') top.value.forEach(g => add(g.pl, g.n));
    const list = [...cand], total = list.length; let done = 0, found = null;
    await Promise.all([0,1,2].map(async () => {
      while (!found && !sg.aborted && list.length){
        const [pl,nm] = list.shift();
        prog.textContent = `сканирую: ${nm} (${done}/${total})`;
        const s = await scanGame(pl, target, pages, sg).catch(()=>null);
        done++;
        if (s && !found){ found = {pl,nm,s}; ac.abort(); }
      }
    }));
    if (found){
      prog.textContent = '';
      dbPush('sightings/'+uid,{t:Date.now(),place:found.pl,job:found.s.id,name:found.nm}).then(()=>loadSightings(uid));

    } else {
      prog.textContent = sg.aborted ? 'остановлено' : `не найден среди ${total} игр (проверено страниц серверов на игру: до ${pages}). Игрок не в игре, на приватном сервере или в другой игре.`;
    }
  }catch(e){ prog.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}


async function friendsOf(id){
  let list = [], err = '', ok = false;
  for (let i=0;i<4 && !ok;i++){
    try{ const r = await api('friends',`/v1/users/${id}/friends`); if (r && Array.isArray(r.data)){ list = r.data; ok = true; } }catch(e){ err = e.message; }
    if (!ok) await sleep(1200*(i+1));
  }
  if (!list.length){
    try{
      let cur = '';
      for (let i=0;i<10;i++){
        const r = await api('friends',`/v1/users/${id}/friends/find?limit=50${cur?'&cursor='+encodeURIComponent(cur):''}`);
        ok = true; list.push(...(r.PageItems||r.data||[])); cur = r.NextCursor||r.nextPageCursor; if (!cur) break;
      }
    }catch(e){ err = e.message; }
  }
  if (!list.length){
    try{
      const r = await api('friends',`/v1/users/${id}/friends?userSort=StatusFrequents`);
      if (r && Array.isArray(r.data) && r.data.length){ list = r.data; ok = true; }
    }catch(e){ err = e.message; }
  }
  if (!list.length){
    if (!ok) throw new Error('Не удалось загрузить список друзей. Попробуйте ещё раз.');
    let c = 0; try{ c = (await api('friends',`/v1/users/${id}/friends/count`)).count; }catch{}
    if (c > 0) throw new Error(`У игрока ${c} друзей, но Roblox сейчас не отдаёт список. Попробуйте ещё раз.`);
  }
  const seen = new Set(); list = list.filter(f => f && f.id && !seen.has(f.id) && seen.add(f.id));
  const need = list.filter(f => !f.name).map(f => f.id);
  for (let i=0;i<need.length;i+=100){
    try{ const r = await api('users','/v1/users', post({userIds:need.slice(i,i+100),excludeBannedUsers:false})); const m = {}; (r.data||[]).forEach(x => m[x.id] = x); list = list.map(f => f.name ? f : (m[f.id]||f)); }catch{}
  }
  return list.map(f => ({id:f.id, name:f.name||String(f.id), displayName:f.displayName||f.name||String(f.id)}));
}

function graph(u, fr){
  const c = $('#cv'), d = devicePixelRatio||1, W = c.clientWidth, H = c.clientHeight;
  c.width = W*d; c.height = H*d;
  const x = c.getContext('2d'); x.scale(d,d);
  const cx = W/2, cy = H/2, R = Math.min(W,H)/2-50;
  const nodes = fr.map((f,i)=>({f, x:cx+R*Math.cos(i/fr.length*6.283), y:cy+R*Math.sin(i/fr.length*6.283)}));
  x.strokeStyle='#333'; nodes.forEach(n=>{x.beginPath();x.moveTo(cx,cy);x.lineTo(n.x,n.y);x.stroke()});
  x.fillStyle='#fff'; x.beginPath(); x.arc(cx,cy,10,0,7); x.fill();
  x.font='10px monospace'; x.textAlign='center'; x.fillText(u.name,cx,cy+26);
  nodes.forEach(n=>{x.fillStyle='#0b0b0b';x.strokeStyle='#fff';x.beginPath();x.arc(n.x,n.y,6,0,7);x.fill();x.stroke();x.fillStyle='#aaa';x.fillText(n.f.name.slice(0,14),n.x,n.y+19)});
  c.onclick = e => {
    const r = c.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top;
    const n = nodes.find(n=>Math.hypot(n.x-mx,n.y-my)<14);
    if (n) act('friends', String(n.f.id));
  };
}

function spark(h){
  if (h.length<2) return '';
  const mx = Math.max(...h.map(x=>x.p),1), mn = Math.min(...h.map(x=>x.p)), rg = (mx-mn)||1;
  const ln = h.map((x,i)=>(i/(h.length-1)*300).toFixed(1)+','+(8+(1-(x.p-mn)/rg)*44).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 300 60" preserveAspectRatio="none"><defs><linearGradient id="sgf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`+
    [15,30,45].map(y=>`<line x1="0" x2="300" y1="${y}" y2="${y}" stroke="#222" vector-effect="non-scaling-stroke"/>`).join('')+
    `<polygon points="0,60 ${ln} 300,60" fill="url(#sgf)"/><polyline points="${ln}" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

}

async function srvCC(id, quiet){
  const S = window.SRV; if (S.cc[id]) return S.cc[id];
  if (!workerOn()){ if (!quiet) toast('Страна сервера недоступна'); throw new Error('worker'); }
  const body = {placeId:+S.place, isTeleport:false, gameId:id, gameJoinAttemptId:sess()};
  const go = tok => fetch(workerUrl('https://gamejoin.roblox.com/v1/join-game-instance'), {method:'POST', headers:{'Content-Type':'application/json', ...(tok?{'X-CSRF-TOKEN':tok}:{})}, body:JSON.stringify(body)});
  let r = await go('');
  if (r.status===403){ const t = r.headers.get('x-csrf-token'); if (t) r = await go(t); }
  const j = await r.json().catch(()=>({}));
  const ep = j.joinScript && j.joinScript.UdmuxEndpoints && j.joinScript.UdmuxEndpoints[0];
  const ip = ep && ep.Address;
  if (!ip){ if (!quiet) toast('Roblox не отдал адрес сервера'); throw new Error('noip'); }
  const g = await (await fetch('https://ipwho.is/'+encodeURIComponent(ip))).json();
  if (!g.success) throw new Error('geo');
  S.cc[id] = {c:g.country_code, n:g.country}; ls.s('srvcc', S.cc);
  if (!quiet){ fillCC(); renderServers(); }
  return S.cc[id];
}
function fillCC(){
  const S = window.SRV, sel = $('#scc'); if (!sel) return;

}
async function detectCountries(){
  const S = window.SRV, per = +$('#sper').value || 20, list = srvFiltered().slice((S.page-1)*per, S.page*per).filter(s => !S.cc[s.id]), m = $('#ccm');

function applyPre(p){
  const set = (i,v) => { const e = $('#'+i); if (e) e.value = v; };
  if (p==='reset'){ ['sfl','smin','smax','spng'].forEach(i => set(i,'')); set('smode','all'); set('sort','api'); set('scc',''); }
  else if (p==='ping'){ set('sort','ping'); set('smode','free'); }
  else if (p==='fps'){ set('sort','fps'); set('smode','free'); }
  else if (p==='few'){ set('sort','pa'); set('smode','free'); set('smin','1'); }
  else if (p==='many'){ set('sort','pd'); set('smode','free'); }
  else if (p==='free'){ set('smode','free'); }
  SRV.page = 1; renderServers();
}

async function autoCC(){
  const S = window.SRV; if (!S || S.ccBusy || !$('#sacc') || !$('#sacc').checked || S.ccFail>=3) return;
  S.ccBusy = true; const pl = S.place; let ok = 0;

      const m = $('#ccm'); if (m) m.textContent = `страны: ${Object.keys(S.cc).filter(k => S.all.some(x => x.id===k)).length}/${S.all.length}`;

  fillCC(); renderServers(true);
}

const BLOX_GUILD = '';

async function blReq(url){
  const h = {Authorization:BLOX_KEY};
  let r;
  try{ r = await fetch(url, {headers:h}); }catch{ r = await fetch(workerUrl(url), {headers:h}); }
  const j = await r.json().catch(()=>({}));
  if (r.status===404) return {};
  if (!r.ok) throw new Error(j.error || j.message || 'HTTP '+r.status);
  return j;
}
async function blox(mode){
  const out=$(mode==='d2r'?'#bres1':'#bres2'), q=$(mode==='d2r'?'#bd':'#br2').value.trim();
  if (!q){ out.innerHTML='<div class="msg err">Введите значение</div>'; return; }
  if (!BLOX_KEY || !BLOX_GUILD){ out.innerHTML='<div class="msg">Сервис Bloxlink временно недоступен.</div>'; return; }
  out.innerHTML='<div class="msg">запрос…</div>';
  try{
    const g = encodeURIComponent(BLOX_GUILD);
    if (mode==='d2r'){
      if (!/^\d{15,25}$/.test(q)) throw new Error('Введите числовой Discord ID');
      const j = await blReq(`https://api.blox.link/v4/public/guilds/${g}/discord-to-roblox/${q}`);
      const rid = j.robloxID; let ru = j.resolved?.roblox;
      if (!rid){ out.innerHTML = '<div class="msg">Аккаунт не привязан</div>'; return; }
      if (!ru) ru = await api('users','/v1/users/'+rid).catch(()=>null);
      out.innerHTML = row('Roblox ID',esc(rid))+row('ник',esc(ru?.name||'—'))+row('отображаемое имя',esc(ru?.displayName||'—'))+`<div class="bar"><button onclick="act('profile','${esc(rid)}')">Профиль</button></div>`;
    } else {
      const u = await resolveUser(q), j = await blReq(`https://api.blox.link/v4/public/guilds/${g}/roblox-to-discord/${u.id}`), ids = j.discordIDs||[];
      out.innerHTML = row('Roblox',esc(u.name)+' · '+u.id)+(ids.length ? ids.map(d=>row('Discord ID',esc(d))+row('Discord-ник',esc(j.resolved?.discord?.[d]?.user?.username||j.resolved?.discord?.[d]?.nick||'—'))).join('') : '<div class="msg">Discord не привязан</div>');
    }
  }catch(e){ out.innerHTML = `<div class="msg err">Ошибка: ${esc(e.message)}</div>`; }
}


async function wjson(sub, path){
  const r = await fetch(workerUrl(`https://${sub}.roblox.com${path}`));
  const t = await r.text(); let j = null; try{ j = t ? JSON.parse(t) : null; }catch{}
  if (!r.ok) throw new Error((j && (j.errors?.[0]?.message || j.message)) || 'HTTP '+r.status);
  return j;
}
const VK = {punishmentTypeDescription:'тип наказания',beginDate:'начало',endDate:'окончание',messageToUser:'сообщение Roblox',badUtterances:'нарушения',isAppealable:'можно обжаловать',hasAppealed:'обжаловано',punishmentId:'id наказания',reviewer:'проверяющий'};
function kv(o){
  return Object.entries(o).filter(([,v])=>v!=null && v!=='' && !(Array.isArray(v)&&!v.length)).map(([k,v]) => {
    const s = (/date/i.test(k) && !isNaN(Date.parse(v))) ? new Date(v).toLocaleString('ru-RU') : (typeof v==='object' ? esc(JSON.stringify(v)) : esc(v));
    return row(esc(VK[k]||k), s);
  }).join('');
}

async function fpDoc(url){
  const tries = [
    () => workerUrl(url),
    () => 'https://corsproxy.io/?url='+encodeURIComponent(url),
    () => 'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
    () => 'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url)
  ];
  for (const t of tries){
    try{
      const r = await fetch(t()); if (!r.ok) continue;
      const txt = await r.text(); if (!/tc-item/.test(txt)) continue;
      return new DOMParser().parseFromString(txt,'text/html');
    }catch{}
  }
  throw new Error('FunPay сейчас недоступен. Попробуйте ещё раз чуть позже.');
}
async function loadRobux(){
  const o = $('#rxr'); o.innerHTML = '<div class="msg">загрузка…</div>';
  try{
    const d = await fpDoc(FP_URL), min = +$('#fpm').value||0;
    const num = e => { if (!e) return NaN; const v = e.getAttribute('data-s'); return parseFloat(v!=null&&v!==''?v:String(e.textContent).replace(/\s/g,'').replace(/[^\d.,]/g,'').replace(',','.')); };
    let rows = [...d.querySelectorAll('a.tc-item')].map(r => ({p:num(r.querySelector('.tc-price')), a:num(r.querySelector('.tc-amount')), u:(r.querySelector('.tc-price')?.textContent||'').trim(), n:(r.querySelector('.media-user-name')?.textContent||'').trim(), h:r.href})).filter(x => x.p>0);
    if (!rows.length) throw new Error('На FunPay сейчас нет предложений.');
    const big = rows.filter(x => !(x.a<min)); if (big.length) rows = big;
    let cbr = {}; try{ cbr = (await (await fetch('https://www.cbr-xml-daily.ru/daily_json.js')).json()).Valute; }catch{}
    const usdR = cbr.USD?.Value || 90, eurR = cbr.EUR?.Value || 100;
    const cur = u => /\$/.test(u) ? 'usd' : /€/.test(u) ? 'eur' : 'rub';
    const per = Math.min(...rows.map(x=>x.p)) < 5 ? 1000 : 1;
    rows.forEach(x => { const v = x.p*per, c = cur(x.u); x.rub = c==='usd' ? v*usdR : c==='eur' ? v*eurR : v; x.usd = x.rub/usdR; });
    rows.sort((a,b)=>a.rub-b.rub); const b = rows[0]; window.RX = b;
    const tm = new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    o.innerHTML = `<div class="lbl">САМЫЙ ДЕШЁВЫЙ КУРС ЗА 1000 ROBUX</div><div class="rx">${b.rub.toFixed(2)} руб. <span style="color:var(--mu)">/ $${b.usd.toFixed(3)}</span></div>`+row('продавец',esc(b.n||'—'))+row('в наличии',fmt(b.a))+row('курс доллара ЦБ',usdR.toFixed(2)+' руб.')+row('обновлено',tm)+
      `<div class="tw" style="margin-top:14px"><table><thead><tr><th>ПРОДАВЕЦ</th><th>В НАЛИЧИИ</th><th>РУБ. ЗА 1000</th><th>USD ЗА 1000</th><th></th></tr></thead><tbody>${rows.slice(0,15).map(x=>`<tr><td>${esc(x.n||'—')}</td><td>${fmt(x.a)}</td><td>${x.rub.toFixed(2)}</td><td>${x.usd.toFixed(3)}</td><td><a class="btn sm" target="_blank" rel="noopener" href="${esc(x.h)}">Лот</a></td></tr>`).join('')}</tbody></table></div>`;
    $('#rb').dispatchEvent(new Event('input'));
  }catch(e){ errBoxFn(o, e.message, 'loadRobux()'); }
}

async function cPersist(){

function cRename(k, id){
  const el = document.querySelector(`#cs ${k==='c'?'.ci':'.ch'}[data-id="${id}"]`), o = k==='c' ? cChan(id) : cCat(id); if (!el || !o) return;

  el.innerHTML = `<input class="rni" maxlength="60" value="${esc(o.name)}">`;
  const inp = el.firstChild; inp.focus(); inp.select(); let done = false;
  const fin = async ok => {
    if (done) return; done = true; const v = inp.value.trim(), old = o.name;
    if (ok && v && v!==old){ o.name = v; if (!await cPersist()) o.name = old; if (k==='c' && CH.cur===id && $('#cm')){ cSide(); cShell(); cLoad(); } } else cSide();
  };
  inp.onkeydown = e => { e.stopPropagation(); if (e.key==='Enter') fin(true); else if (e.key==='Escape') fin(false); };

async function cMove(k, id, dir){
  const S = CH.S;

  else { const c = cChan(id), l = S.chans.filter(x => x.cat===c.cat), i = l.indexOf(c), j = i+dir; if (j<0 || j>=l.length) return; const a = S.chans.indexOf(c), b = S.chans.indexOf(l[j]); [S.chans[a],S.chans[b]] = [S.chans[b],S.chans[a]]; }
  cPersist();
}
function cMoveTo(id, cat){ const c = cChan(id); if (!c) return; CH.S.chans = CH.S.chans.filter(x => x!==c); c.cat = cat; CH.S.chans.push(c); cPersist(); }
async function cDup(id){

async function cProfile(n){
  const me = CH.me;
  if (cCanAny() && !CH.mem.some(u => u.name===n)) await cMemLoad();
  const u = CH.mem.find(x => x.name===n), sn = CH.seen[n], isMe = n===me.name, isAd = !!(u ? u.admin : (sn && sn.a)) || (isMe && me.admin);
  const onl = isMe || (sn && Date.now()-sn.t < 15*60000), rs = cAllRoles();
  const st = onl ? `<span class="ok">${L('в сети (недавно писал)','online (recently active)')}</span>` : sn ? L('писал: ','last message: ') + new Date(sn.t).toLocaleString('ru-RU') : '—';
  let h = `<div class="pfh"><div class="avt big${isAd?' ad':''}">${esc([...String(n||'?')][0].toUpperCase())}</div><div><div class="pfn">${esc(n)}${isAd?' ★':''}${u&&u.banned?' <span class="stt">BANNED</span>':''}${u&&cIsMuted(u)?' <span class="stt m">MUTED</span>':''}</div><div class="msg" style="padding:0">${isAd?L('Администратор','Administrator'):L('Участник','Member')}</div></div></div>`;
  h += row(L('Статус','Status'), st);
  if (u){
    const rc = (u.roles||[]).map(id => { const r = rs.find(x => x.id===id) || {name:id,color:'#888'}; return `<span class="rc on"><i class="dt" style="background:${esc(r.color||'#888')}"></i>${esc(r.name)}</span>`; }).join('');
    h += row(L('Роли','Roles'), rc || '—') + row(L('Регистрация','Registered'), dt(u.created));
    if (cCan('viewIP')) h += row('IP', esc(u.ip||'—')) + row(L('Устройство','Device'), esc(u.dev||'—') + ' / ' + esc(u.fp||'—')) + row('ID', esc(u.id));
    if (!isMe){
      const b = [];
      if (cCan('viewIP') && u.ip) b.push(`<button class="sm" data-ip="${esc(u.ip)}" onclick="cp(this.dataset.ip)">${L('Копировать IP','Copy IP')}</button>`);
      if (cCan('manageRoles')) b.push(`<button class="sm" data-r="${esc((u.roles||[]).join(','))}" onclick="cRoles('${esc(u.id)}',this.dataset.r,'p')">${L('Роли','Roles')}</button>`);
      if (cCan('mute')) b.push(`<button class="sm" onclick="cMute('${esc(u.id)}',${cIsMuted(u)},'p')">${cIsMuted(u)?L('Снять мут','Unmute'):L('Замутить','Mute')}</button>`);
      if (cCan('ban')) b.push(`<button class="sm" onclick="cBan('${esc(u.id)}',${!!u.banned},'p')">${u.banned?L('Разбанить','Unban'):L('Забанить','Ban')}</button>`);
      if (cCan('ban')) h += `<div class="pfa"><label><input type="checkbox" id="bka" checked> account</label><label><input type="checkbox" id="bki" checked> IP</label><label><input type="checkbox" id="bkd" checked> device</label></div>`;
      if (b.length) h += `<div class="pfa">${b.join('')}</div>`;
    }
  }
  const old = $('#cprof'); if (old) old.remove();
  const d = document.createElement('div'); d.id = 'cprof'; d.className = 'ovl';
  d.innerHTML = `<section class="p"><h3>${L('Профиль','Profile')}</h3><div class="pb">${h}<div class="bar" style="margin:14px 0 0;justify-content:flex-end"><button onclick="$('#cprof').remove()">${L('Закрыть','Close')}</button></div></div></section>`;
  d.onmousedown = e => { if (e.target===d) d.remove(); };
  document.body.appendChild(d);
}

function cCan(p){
  const me = CH.me, S = CH.S || {}; if (!me) return false; if (me.admin) return true;

  return (me.roles||[]).some(id => { const r = (S.roles||[]).find(x => x.id===id); return r && r.perms && (r.perms[p] || r.perms.admin); });

function cAllRoles(){

  CH.mem.forEach(u => (u.roles||[]).forEach(n => { if (!have.has(n)){ have.add(n); out.push({id:n,name:n,color:'#888',perms:{},implicit:true}); } }));

}
const gp = (o,p) => p.split('.').reduce((a,k) => a==null ? a : a[k], o);
const sp = (o,p,v) => { const k = p.split('.'), l = k.pop(); k.reduce((a,x) => (a[x]==null ? (a[x] = {}) : a[x]), o)[l] = v; };
const tog = (path, label, val, desc, r) => `<div class="pm"><div><b>${lb(label)}</b>${desc?`<small>${lb(desc)}</small>`:''}</div><input type="checkbox" class="sw" data-d="${path}" ${r?'data-r="1"':''} ${val?'checked':''}></div>`;

const tags = (path, arr, ph) => `<div class="tgs" data-p="${path}">${(arr||[]).map((w,i) => `<span class="tg">${esc(w)}<i data-rm="${i}">×</i></span>`).join('')}<input class="tgin" placeholder="${esc(ph||L('Введите и нажмите Enter','Type and press Enter'))}"></div>`;
function cBind(root, get, rerender){
  const fo = p => { const n = root.querySelector(`.tgs[data-p="${p}"] .tgin`); if (n) n.focus(); };
  root.addEventListener('input', e => {
    const el = e.target;
    if (el.classList.contains('pks')){
      const sel = gp(get(), el.dataset.ps) || [], q = el.value.trim().toLowerCase();
      el.nextElementSibling.innerHTML = q ? (CH.mem.filter(u => u.name.toLowerCase().includes(q) && !sel.includes(String(u.id))).slice(0,8).map(u => `<div class="ur" data-ua="${el.dataset.ps}" data-v="${esc(u.id)}">${esc(u.name)}</div>`).join('') || `<div class="ur" style="cursor:default;color:var(--mu)">—</div>`) : '';
      return;
    }
    if (!el.dataset.d) return;
    sp(get(), el.dataset.d, el.type==='checkbox' ? el.checked : (el.type==='number' || el.dataset.n) ? (+el.value || 0) : el.value);
    if (el.dataset.live){ const t_ = root.querySelector(el.dataset.live); if (t_) t_.textContent = el.value; }
    if (el.dataset.livec){ const t_ = root.querySelector(el.dataset.livec); if (t_) t_.style.background = el.value; }
    if (el.dataset.r) rerender();
  });
  root.addEventListener('click', e => {
    const tg = e.target.closest('[data-tg]'), ua = e.target.closest('[data-ua]'), rm = e.target.closest('[data-rm]');
    if (tg){ const a = gp(get(), tg.dataset.tg) || [], v = tg.dataset.v, i = a.indexOf(v); i<0 ? a.push(v) : a.splice(i,1); sp(get(), tg.dataset.tg, a); rerender(); }
    else if (ua){ const a = gp(get(), ua.dataset.ua) || [], v = String(ua.dataset.v); if (!a.includes(v)) a.push(v); sp(get(), ua.dataset.ua, a); rerender(); }
    else if (rm){ const p = rm.closest('.tgs').dataset.p, a = gp(get(), p) || []; a.splice(+rm.dataset.rm, 1); sp(get(), p, a); rerender(); fo(p); }
  });
  root.addEventListener('keydown', e => {
    const el = e.target; if (!el.classList || !el.classList.contains('tgin')) return;

    else if (e.key==='Backspace' && !el.value && a.length){ a.pop(); sp(get(), p, a); rerender(); fo(p); }
  });
}

async function cSetSave(){
  const c = cChan(CS.id); if (!c) return; const v = CS.c;
  c.name = (v.name||'').trim() || c.name; c.cat = v.cat || ''; c.s = v.s;
  if (!await cPersist()) return;
  cSvClose();
  try{
    const j = await cApi('struct'), sc = (j.S.chans||[]).find(x => x.id===CS.id);
    const nz = x => (Array.isArray(x) && !x.length) || x===0 || x===false || x==null || x==='' ? null : x;
    const bad = sc && ['viewRoles','sendRoles','viewUsers','sendUsers','noInvites','minLen','maxLinks','slow','minAge','banwords'].some(k => JSON.stringify(nz((sc.s||{})[k])) !== JSON.stringify(nz(v.s[k])));
    if (bad){ alert(L('Сервер (воркер) сохранил не все настройки канала. Нужно обновить воркер.','The worker did not keep all channel settings. The worker needs an update.')); CH.S = j.S; cSide(); }
  }catch{}
  if (CH.cur===CS.id){ cShell(); cLoad(); }
}
function cDnD(){
  const q = $('#cs');
  q.ondragstart = e => { const d = e.target.closest('[draggable]'); if (d) e.dataTransfer.setData('text', d.dataset.k+':'+d.dataset.id); };
  q.ondragover = e => e.preventDefault();
  q.ondrop = async e => {
    e.preventDefault(); const [k,id] = e.dataTransfer.getData('text').split(':'), S = CH.S, tg = e.target.closest('.ci,.ch,.cg'); if (!tg || !id) return;
    const isC = tg.classList.contains('ci'), tk = tg.dataset.k, tid = tg.dataset.id;
    if (k==='c'){
      const c = S.chans.find(x => x.id===id); if (!c || (isC && tid===id)) return;
      S.chans = S.chans.filter(x => x!==c);
      if (isC){ const tc = S.chans.find(x => x.id===tid); c.cat = tc.cat; S.chans.splice(S.chans.indexOf(tc),0,c); }
      else { c.cat = tk==='z' ? '' : tid; S.chans.push(c); }
    } else if (k==='g'){
      const g = S.cats.find(x => x.id===id); if (!g) return;
      const to = isC ? S.chans.find(x => x.id===tid).cat : tid; S.cats = S.cats.filter(x => x!==g);
      const i = S.cats.findIndex(x => x.id===to); S.cats.splice(i<0?(tk==='z'?0:S.cats.length):i,0,g);
    }
    try{ await cApi('struct/save',{S}); }catch(er){ alert(er.message); }
    cSide();
  };
}
const cSave = () => cApi('struct/save',{S:CH.S}).then(cSide).catch(e => alert(e.message));
const cAdd = k => cNew(k, '');
function cDelCat(id){ if (!confirm('Delete category? Channels move out of it.')) return; CH.S.chans.forEach(c => { if (c.cat===id) c.cat = ''; }); CH.S.cats = CH.S.cats.filter(g => g.id!==id); cSave(); }
function cDelCh(id){ if (!confirm('Delete channel?')) return; CH.S.chans = CH.S.chans.filter(c => c.id!==id); { const m = $('#cmod'); if (m) m.remove(); } if (CH.cur===id) CH.cur = null; cSave().then(pgMain); }
function cShell(){
  const c = CH.S.chans.find(x => x.id===CH.cur); if (!c) return;
  const RU = LANG==='ru', ro = ((c.s||{}).readOnly || !cCan('send')) && !cCan('admin'); CH.sig = '';
  $('#cm').innerHTML = `<div class="ctop"><button class="sm mb" onclick="cDrawer('l')">☰</button><b>${c.type==='forum'?'▤':'#'} ${esc(c.name)}</b><span class="topic">${esc((c.s||{}).topic||'')}</span>${CH.th?`<button class="sm" onclick="CH.th=null;cShell();cLoad()">← ${t('back')}</button>`:''}<button class="sm mb rb" onclick="cDrawer('r')">👥</button></div><div id="ml"></div><div id="me" class="err"></div><form class="comp" onsubmit="cSend(event)">${c.type==='forum'&&!CH.th?`<input id="mt" placeholder="${t('title')}" ${ro?'disabled':''}>`:''}<textarea id="mi" rows="1" ${ro?'disabled':''} placeholder="${ro?(RU?'Только чтение':'Read-only'):(c.type==='text'||CH.th?(RU?'Сообщение в #':'Message #')+esc(c.name):t('msg'))}" autocomplete="off" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();cSend(event)}"></textarea><button ${ro?'disabled':''}>${t('send')}</button></form>`;
}
function cOpen(id){
  CH.cur = id; CH.th = null; clearInterval(window.GT); cSide(); cShell(); cLoad(); cMemRender();
  const c = $('.chat'); if (c) c.classList.remove('l','r');
  window.GT = setInterval(cLoad, 4000);
}
const cTh = id => { CH.th = id; cShell(); cLoad(); };
async function cLoad(){
  const c = CH.S.chans.find(x => x.id===CH.cur); if (!c || !$('#ml')) return;
  const my = CH.cur + '|' + (CH.th||'');
  let msgs;
  try{ msgs = (await cApi('msgs?c='+c.id+(CH.th?'&th='+CH.th:''))).msgs || []; }catch(e){ if ($('#ml') && CH.me) $('#ml').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  if (my !== CH.cur + '|' + (CH.th||'') || !$('#ml')) return;
  CH.msgs = msgs;
  msgs.forEach(m => { const o = CH.seen[m.n]; if (!o || m.t > o.t) CH.seen[m.n] = {a:!!m.a, t:m.t}; });
  const sig = my + '|' + msgs.length + '|' + (msgs.length ? msgs[msgs.length-1].id : '') + '|' + msgs.map(m=>m.id).join(',').length;
  cMemRender();
  if (sig === CH.sig) return; CH.sig = sig;
  const ml = $('#ml'), nb = ml.scrollTop+ml.clientHeight >= ml.scrollHeight-40, ad = cCan('deleteMsgs'), RU = LANG==='ru';
  let h = '', last = null, lastDay = '';
  const forum = c.type==='forum' && !CH.th;
  msgs.forEach(m => {
    const d = new Date(m.t), day = d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
    if (day !== lastDay){ h += `<div class="dsep"><span>${day}</span></div>`; lastDay = day; last = null; }
    if (forum){
      h += `<div class="fp" onclick="cTh('${m.id}')"><b>${esc(m.title||'—')}</b><small>${esc(m.n)}${m.a?' ★':''} · ${d.toLocaleString('ru-RU')}</small></div>`; return;
    }
    const cont = last && last.n===m.n && m.t-last.t < 300000;
    const del = ad ? `<button class="sm act" onclick="cDelMsg('${m.id}')">✕</button>` : '';
    const body = `${m.title&&CH.th&&!cont?`<b>${esc(m.title)}</b><br>`:''}<span class="tx">${lnk(m.x)}</span>`;
    h += cont
      ? `<div class="mg" data-id="${m.id}"><div class="gut"></div><div class="body">${body}</div>${del}</div>`
      : `<div class="mg first" data-id="${m.id}"><div class="avt pn${m.a?' ad':''}" data-n="${esc(m.n)}" onclick="cProfile(this.dataset.n)">${esc([...String(m.n||'?')][0].toUpperCase())}</div><div class="body"><div class="hd"><b class="pn" data-n="${esc(m.n)}" onclick="cProfile(this.dataset.n)">${esc(m.n)}${m.a?' ★':''}</b><small>${d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</small></div>${body}</div>${del}</div>`;
    last = m;
  });
  ml.innerHTML = (CH.S.welcome && !forum ? `<div class="wl">${esc(CH.S.welcome)}</div>` : '') + (h || `<div class="msg" style="padding:20px 0">${RU?'Сообщений пока нет. Напишите первым.':'No messages yet.'}</div>`);
  ml.querySelectorAll('.tx img').forEach(i => i.onclick = () => window.open(i.src, '_blank', 'noopener'));
  if (nb) ml.scrollTop = ml.scrollHeight;
}
async function cSend(e){
  e.preventDefault && e.preventDefault(); const mi = $('#mi'); if (!mi) return; const x = mi.value.trim(); if (!x) return;
  const btn = document.querySelector('.comp button'); if (btn) btn.disabled = true;
  try{
    await cApi('send',{c:CH.cur,text:x,title:$('#mt')?$('#mt').value:'',th:CH.th});
    mi.value = ''; mi.style.height = 'auto'; if ($('#mt')) $('#mt').value = ''; $('#me').textContent = '';
    CH.seen[CH.me.name] = {a:!!CH.me.admin, t:Date.now()}; CH.sig = ''; await cLoad();
    const ml = $('#ml'); if (ml) ml.scrollTop = ml.scrollHeight; mi.focus();
  }catch(er){ if (!CH.ban && $('#me')) $('#me').textContent = er.message; }
  finally{ if (btn) btn.disabled = false; }
}
async function cMemLoad(){
  if (!CH.me || !cCanAny()) return;
  try{ CH.mem = (await cApi('members')).users || []; cMemRender(); }catch{}
}
function cMemRender(){
  const el = $('#cmem'); if (!el || !CH.me) return;
  const RU = LANG==='ru', now = Date.now(), me = CH.me, map = new Map();
  CH.mem.forEach(u => map.set(u.name, {n:u.name, a:!!u.admin, b:!!u.banned, t:0}));
  Object.entries(CH.seen).forEach(([n,s]) => { const o = map.get(n) || {n, a:false, b:false, t:0}; o.a = o.a || s.a; o.t = s.t; map.set(n,o); });
  const mo = map.get(me.name) || {n:me.name, a:false, b:false, t:0}; mo.a = mo.a || !!me.admin; mo.t = now; map.set(me.name, mo);
  const all = [...map.values()], on = o => o.t && now-o.t < 15*60000;
  const srt = (a,b) => (on(b)-on(a)) || a.n.localeCompare(b.n);
  const grp = (title, l) => l.length ? `<div class="mh">${title} — ${l.length}</div>` + l.sort(srt).map(o => `<div class="mu${on(o)?' on':''}${o.b?' bn':''}" data-n="${esc(o.n)}" onclick="cProfile(this.dataset.n)"><div class="avt${o.a?' ad':''}">${esc([...String(o.n||'?')][0].toUpperCase())}<i class="dot"></i></div><span>${esc(o.n)}${o.a?' ★':''}</span></div>`).join('') : '';
  el.innerHTML = `<div class="sh"><b>${t('members')} · ${all.length}</b>${cCanAny()?`<button class="sm" title="${RU?'Управление':'Manage'}" onclick="cMembers()">⚙</button>`:''}</div><div class="sl">${grp(RU?'Администрация':'Staff', all.filter(o=>o.a))}${grp(RU?'Участники':'Members', all.filter(o=>!o.a))}${CH.mem.length?'':`<div class="hint">${RU?'Показаны те, кто писал в открытых вами каналах.':'Shows people who posted in channels you opened.'}</div>`}</div>`;
}
const cDelMsg = id => cApi('del',{c:CH.cur,id}).then(cLoad).catch(e => alert(e.message));
function cMembers(){ cServer('members'); }
async function cBan(uid, undo, from){
  let reason = ''; if (!undo){ const r = prompt(L('Причина','Reason')); if (r===null) return; reason = r; }
  const g = id => { const e = document.getElementById(id); return e ? e.checked : true; };
  try{ await cApi('ban',{uid,undo,reason,acc:g('bka'),ip:g('bki'),dev:g('bkd')}); await cMemLoad(); cAfter(uid, from); }catch(e){ alert(e.message); }
}
function cAfter(uid, from){ if (from==='p'){ const u = CH.mem.find(x => String(x.id)===String(uid)); if (u) cProfile(u.name); } else if (from==='s') svMlist(); else if (from!=='m') cMembers(); }

wApi('/api/hello').catch(()=>{});
route();
</script>
