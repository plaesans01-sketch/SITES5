<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>IRONWALL Activator</title>
  <style>
    body {font-family:JetBrains Mono,monospace;background:#0b0b0b;color:#e8e8e8;margin:0;padding:40px;display:grid;place-items:center;height:100vh;text-align:center}
    h1 {letter-spacing:.2em;margin:0 0 20px}
    button {padding:12px 32px;font-size:13px;background:#000;border:1px solid #fff;color:#fff;cursor:pointer}
    button:hover {background:#fff;color:#000}
    .status {margin-top:20px;font-size:13px}
    .bad {color:#ff6b6b}
  </style>
</head>
<body>
  <h1>IRONWALL</h1>
  <button id="btn">ЗАПУСТИТЬ</button>
  <div id="status" class="status"></div>

  <script>
    const WORKER = "https://quiet-resonance-d42c.lvlyvcbcla.workers.dev/launch";
    const ALLOWED = "https://nfdjiw2i.github.io";

    async function start() {
      const btn = document.getElementById("btn");
      const st = document.getElementById("status");
      btn.disabled = true;
      st.textContent = "Отправляем запрос...";

      try {
        const form = new FormData();
        form.append("page", "/IRONWALL/");
        form.append("host", ALLOWED);

        const r = await fetch(WORKER, {
          method: "POST",
          body: form
        });

        if (!r.ok) throw new Error(`HTTP ${r.status}`);

        const text = await r.text();
        if (text.includes("ACCESS DENIED")) throw new Error("Доступ запрещён");

        const blob = new Blob([text], {type: "text/html"});
        window.open(URL.createObjectURL(blob), "_blank");

        st.textContent = "✅ Успешно! Открываем сайт...";
        setTimeout(() => window.close(), 800);
      } catch(e) {
        st.textContent = "Ошибка: " + e.message;
        btn.disabled = false;
        st.classList.add("bad");
      }
    }

    document.getElementById("btn").onclick = start;
    document.addEventListener("keydown", e => { if (e.key === "Enter") start(); });
  </script>
</body>
</html>
