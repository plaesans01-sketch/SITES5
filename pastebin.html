
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRONWALL // PASTE</title>
<style>
:root {
  color-scheme: dark;
  --bg: #050505;
  --panel: #0b0b0b;
  --line: #292929;
  --text: #f2f2f2;
  --muted: #777;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Courier New", monospace;
  min-height: 100vh;
}
header {
  height: 66px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5%;
}
.logo {
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 4px;
}
.status {
  color: #999;
  font-size: 11px;
  letter-spacing: 2px;
}
main {
  width: min(1100px, 90%);
  margin: 55px auto;
}
h1 {
  font-size: clamp(25px, 5vw, 42px);
  letter-spacing: 5px;
  margin: 0 0 10px;
}
.subtitle {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 35px;
}
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 25px;
}
.panel {
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 22px;
}
.panel-title {
  font-size: 12px;
  letter-spacing: 3px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 15px;
  margin-bottom: 20px;
}
label {
  display: block;
  color: #999;
  font-size: 11px;
  letter-spacing: 2px;
  margin: 17px 0 8px;
}
input, textarea {
  width: 100%;
  background: #050505;
  border: 1px solid #333;
  color: white;
  padding: 13px;
  outline: none;
  border-radius: 0;
  font: 13px "Courier New", monospace;
}
input:focus, textarea:focus { border-color: #aaa; }
textarea {
  min-height: 300px;
  resize: vertical;
  line-height: 1.6;
}
button {
  background: white;
  color: black;
  border: 1px solid white;
  padding: 12px 18px;
  font: bold 11px "Courier New", monospace;
  letter-spacing: 2px;
  cursor: pointer;
}
button:hover {
  background: black;
  color: white;
}
button.secondary {
  background: transparent;
  color: white;
  border-color: #444;
}
button.secondary:hover {
  border-color: white;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 17px;
}
#message {
  min-height: 20px;
  color: #aaa;
  font-size: 12px;
  margin-top: 15px;
  overflow-wrap: anywhere;
}
.paste-item {
  border-bottom: 1px solid var(--line);
  padding: 13px 0;
}
.paste-title {
  font-size: 13px;
  overflow-wrap: anywhere;
  margin-bottom: 8px;
}
.paste-meta {
  color: var(--muted);
  font-size: 10px;
  margin-bottom: 10px;
}
.paste-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}
.paste-actions button {
  padding: 7px 9px;
  font-size: 10px;
}
.empty {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}
footer {
  border-top: 1px solid var(--line);
  padding: 22px 5%;
  color: #555;
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 70px;
}
@media(max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  main { margin-top: 35px; }
  header { padding: 0 5%; }
}
</style>
</head>
<body>
<header>
  <div class="logo">IRONWALL</div>
  <div class="status">PASTE SERVICE // ONLINE</div>
</header>

<main>
  <h1>PASTE STORAGE</h1>
  <div class="subtitle">CREATE // STORE // SHARE // RAW</div>

  <div class="layout">
    <section class="panel">
      <div class="panel-title">NEW PASTE</div>

      <label for="pasteTitle">TITLE</label>
      <input id="pasteTitle" maxlength="160" placeholder="Untitled">

      <label for="pasteContent">CONTENT</label>
      <textarea id="pasteContent" placeholder="Enter your text here..."></textarea>

      <div class="actions">
        <button id="saveButton" type="button">SAVE PASTE</button>
        <button id="newButton" class="secondary" type="button">NEW</button>
      </div>

      <div id="message" role="status"></div>
    </section>

    <aside class="panel">
      <div class="panel-title">RECENT PASTES</div>
      <div id="pasteList">
        <div class="empty">Loading pastes...</div>
      </div>
      <div class="actions">
        <button id="refreshButton" class="secondary" type="button">REFRESH</button>
      </div>
    </aside>
  </div>
</main>

<footer>IRONWALL // PRIVATE TEXT STORAGE</footer>

<script>
const API = "https://pastebin.lvlyvcbcla.workers.dev/";

const titleInput = document.getElementById("pasteTitle");
const contentInput = document.getElementById("pasteContent");
const message = document.getElementById("message");
const pasteList = document.getElementById("pasteList");
const saveButton = document.getElementById("saveButton");

let currentPasteId = null;

async function apiRequest(path, options = {}) {
  const response = await fetch(API + path, {
    ...options,
    headers: {
      ...(options.body ? { "Content-Type": "application/json" } : {}),
      ...(options.headers || {})
    }
  });

  const text = await response.text();
  let data;

  try {
    data = text ? JSON.parse(text) : {};
  } catch {
    throw new Error("Worker returned an invalid response");
  }

  if (!response.ok) {
    throw new Error(data.error || "HTTP " + response.status);
  }

  return data;
}

function showMessage(text) {
  message.textContent = text;
}

function clearEditor() {
  currentPasteId = null;
  titleInput.value = "";
  contentInput.value = "";
  showMessage("");
}

async function savePaste() {
  const title = titleInput.value.trim() || "Untitled";
  const content = contentInput.value;

  if (!content.trim()) {
    showMessage("ERROR: Paste content is empty.");
    return;
  }

  saveButton.disabled = true;
  saveButton.textContent = "SAVING...";
  showMessage("Connecting to storage...");

  try {
    const result = await apiRequest("/api/pastes", {
      method: "POST",
      body: JSON.stringify({
        id: currentPasteId,
        title,
        content
      })
    });

    currentPasteId = result.id;
    showMessage("SAVED: " + result.id + " | RAW: " + result.raw);
    await loadPastes();
  } catch (error) {
    showMessage("SAVE ERROR: " + error.message);
  } finally {
    saveButton.disabled = false;
    saveButton.textContent = "SAVE PASTE";
  }
}

function makeButton(label, action, secondary = true) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  if (secondary) button.className = "secondary";
  button.addEventListener("click", action);
  return button;
}

async function loadPastes() {
  pasteList.replaceChildren();

  try {
    const pastes = await apiRequest("/api/pastes");

    if (!Array.isArray(pastes) || pastes.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No pastes stored.";
      pasteList.appendChild(empty);
      return;
    }

    for (const paste of pastes) {
      const item = document.createElement("div");
      item.className = "paste-item";

      const title = document.createElement("div");
      title.className = "paste-title";
      title.textContent = paste.title || "Untitled";

      const meta = document.createElement("div");
      meta.className = "paste-meta";
      meta.textContent = "ID: " + paste.id;

      const actions = document.createElement("div");
      actions.className = "paste-actions";

      actions.appendChild(makeButton("OPEN", () => {
        currentPasteId = paste.id;
        titleInput.value = paste.title || "";
        contentInput.value = paste.content || "";
        showMessage("Loaded paste: " + paste.id);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }));

      actions.appendChild(makeButton("RAW", () => {
        window.open(API + "/raw/" + encodeURIComponent(paste.id), "_blank", "noopener");
      }));

      actions.appendChild(makeButton("DELETE", async () => {
        if (!confirm("Delete this paste permanently?")) return;

        try {
          await apiRequest("/api/pastes/" + encodeURIComponent(paste.id), {
            method: "DELETE"
          });

          if (currentPasteId === paste.id) clearEditor();

          showMessage("Paste deleted.");
          await loadPastes();
        } catch (error) {
          showMessage("DELETE ERROR: " + error.message);
        }
      }));

      item.append(title, meta, actions);
      pasteList.appendChild(item);
    }
  } catch (error) {
    const failed = document.createElement("div");
    failed.className = "empty";
    failed.textContent = "LOAD ERROR: " + error.message;
    pasteList.appendChild(failed);
  }
}

saveButton.addEventListener("click", savePaste);
document.getElementById("newButton").addEventListener("click", clearEditor);
document.getElementById("refreshButton").addEventListener("click", loadPastes);

loadPastes();
</script>
</body>
</html>
