<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRONWALL</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#ededed;font-family:'JetBrains Mono',monospace}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.35;filter:grayscale(1)}
header,#app{position:relative;z-index:1}
header{background:rgba(5,5,5,.9);border-bottom:1px solid #292929;backdrop-filter:blur(10px)}
.terminal{background:rgba(12,12,12,.9);border:1px solid #444;box-shadow:none;border-radius:2px}
input,textarea{background:#050505!important;color:#eee!important;border-color:#555!important;border-radius:0!important}
input:focus,textarea:focus{border-color:#fff!important;outline:none}
button{border-radius:2px!important;transition:background .2s,border-color .2s}
button:hover{transform:none}
body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 4px),radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.65) 100%)}
@media(max-width:900px){#pastebin .flex-col{flex-direction:column}}
</style>
</head>
<body>
<canvas id="bgfx"></canvas>
<header class="fixed top-0 left-0 right-0 z-50">
<div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
<span class="text-3xl font-bold tracking-widest">IRONWALL</span>
<span class="text-xs tracking-widest text-white/60">ONLINE</span>
</div>
</header>
<main id="app" class="pt-28 pb-10 max-w-7xl mx-auto px-6">
<section id="pastebin" class="tab-content">
            <div class="flex flex-col lg:flex-row gap-6">
                
                <div class="lg:w-2/3">
                    <h2 class="text-2xl mb-6 flex items-center gap-3">
                        <span>PASTEBIN • RECENT POSTS</span>
                    </h2>
                    <div id="pasteList" class="space-y-4"></div>
                </div>

                
                <div class="lg:w-1/3 terminal p-6 rounded-lg flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold">New Paste</h3>
                        <div class="flex gap-2">
                            <button onclick="createNewPaste()" 
                                    class="px-4 py-1 bg-white text-black text-xs font-bold rounded">NEW</button>
                        </div>
                    </div>
                    
                    <textarea id="pasteContent" rows="12"
                        class="w-full bg-black text-white font-mono text-sm p-4 border border-white/20 focus:outline-none focus:border-white resize-none"
                        placeholder="Write your paste here..."></textarea>
                    
                    <div class="flex gap-3 mt-4">
                        <button onclick="saveCurrentPaste()" 
                                class="flex-1 py-3 bg-white text-black font-bold text-sm rounded hover:bg-white transition">
                            SAVE
                        </button>
                        <button onclick="deleteCurrentPaste()" 
                                class="flex-1 py-3 bg-white text-black font-bold text-sm rounded hover:bg-red-700 transition">
                            DELETE
                        </button>
                    </div>
                    
                    <div class="mt-6">
                        <input id="pasteTitle" type="text" 
                            class="w-full bg-black border border-white/20 p-3 text-sm font-mono focus:outline-none focus:border-white"
                            placeholder="Post title (optional)">
                    </div>
                </div>
            </div>
        </section>
        <section id="pasteViewer" class="hidden mt-6 terminal p-6">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div><div class="text-xs tracking-widest opacity-60">PASTE VIEW</div><h3 id="viewerTitle" class="text-xl font-bold mt-1"></h3></div>
                <div class="flex flex-wrap gap-2">
                    <button id="viewerRaw" class="px-4 py-2 border border-white/40 text-xs">RAW</button>
                    <button id="viewerCopy" class="px-4 py-2 border border-white/40 text-xs">COPY</button>
                    <button id="viewerEdit" class="px-4 py-2 bg-white text-black text-xs font-bold">EDIT</button>
                    <button id="viewerClose" class="px-4 py-2 border border-white/40 text-xs">CLOSE</button>
                </div>
            </div>
            <pre id="viewerCode" class="whitespace-pre-wrap break-words overflow-x-auto text-sm leading-6 p-4 border border-white/20 bg-black"></pre>
        </section>
        <section id="rawViewer" class="hidden mt-6 terminal p-6">
            <div class="flex items-center justify-between gap-3 mb-4"><div class="text-xs tracking-widest opacity-60">RAW SOURCE</div><button id="rawBack" class="px-4 py-2 border border-white/40 text-xs">BACK</button></div>
            <pre id="rawCode" class="whitespace-pre-wrap break-words overflow-x-auto text-sm leading-6"></pre>
        </section>
</main>
<script>

const canvas = document.getElementById('bgfx');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}

function initParticles() {
            particles = [];
            for (let i = 0; i < 120; i++) particles.push(new Particle());
        }
function animateParticles() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
let currentPasteId = null;
let pastes = [];
function saveCurrentPaste() {
            const title = document.getElementById('pasteTitle').value || 'Untitled';
            const content = document.getElementById('pasteContent').value;
            if (!content.trim()) return alert("Paste can't be empty");
            
            const paste = {
                id: currentPasteId || 'p' + Date.now(),
                title: title,
                content: content,
                created: currentPasteId ? pastes.find(p => p.id === currentPasteId).created : Date.now(),
                edited: Date.now()
            };
            
            if (currentPasteId) {
                const idx = pastes.findIndex(p => p.id === currentPasteId);
                if (idx !== -1) pastes[idx] = paste;
            } else {
                pastes.unshift(paste);
            }
            
            localStorage.setItem('ironwallPastes', JSON.stringify(pastes));
            currentPasteId = paste.id;
            loadPasteList();
        }
function deleteCurrentPaste() {
            if (!currentPasteId) return;
            if (confirm("Delete this paste?")) {
                pastes = pastes.filter(p => p.id !== currentPasteId);
                localStorage.setItem('ironwallPastes', JSON.stringify(pastes));
                currentPasteId = null;
                document.getElementById('pasteContent').value = '';
                document.getElementById('pasteTitle').value = '';
                loadPasteList();
            }
        }
function createNewPaste() {
            document.getElementById('pasteContent').value = '';
            document.getElementById('pasteTitle').value = '';
            currentPasteId = null;
            document.getElementById('pasteContent').focus();
        }
function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
        }
function getPasteUrl(id, raw = false) {
            return location.href.split('#')[0] + (raw ? '#/raw/' : '#/') + encodeURIComponent(id);
        }
function copyText(value) {
            if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(value).then(() => alert('Copied'));
            else {
                const field = document.createElement('textarea');
                field.value = value;
                document.body.appendChild(field);
                field.select();
                document.execCommand('copy');
                field.remove();
                alert('Copied');
            }
        }
function loadPasteList() {
            const saved = localStorage.getItem('ironwallPastes');
            pastes = saved ? JSON.parse(saved) : [];
            const container = document.getElementById('pasteList');
            container.innerHTML = pastes.map(p => `
                <div class="terminal p-4 hover:border-white">
                    <div class="flex flex-wrap justify-between items-center gap-3">
                        <button onclick="openPaste('${encodeURIComponent(p.id)}')" class="text-left font-bold break-all">${escapeHTML(p.title)}</button>
                        <span class="text-xs opacity-60">${new Date(p.created).toLocaleString()}</span>
                    </div>
                    <button onclick="openPaste('${encodeURIComponent(p.id)}')" class="block text-left w-full mt-2 text-sm opacity-70 break-words">${escapeHTML(p.content.substring(0,160))}${p.content.length > 160 ? '...' : ''}</button>
                    <div class="flex flex-wrap gap-2 mt-4">
                        <button onclick="openPaste('${encodeURIComponent(p.id)}')" class="px-3 py-2 border border-white/30 text-xs">VIEW</button>
                        <button onclick="copyText(getPasteUrl('${encodeURIComponent(p.id)}',true))" class="px-3 py-2 border border-white/30 text-xs">COPY RAW URL</button>
                    </div>
                </div>`).join('');
        }
function configureViewer(paste) {
            document.getElementById('viewerTitle').textContent = paste.title;
            document.getElementById('viewerCode').textContent = paste.content;
            document.getElementById('viewerRaw').onclick = () => location.hash = '/raw/' + encodeURIComponent(paste.id);
            document.getElementById('viewerCopy').onclick = () => copyText(paste.content);
            document.getElementById('viewerEdit').onclick = () => {
                currentPasteId = paste.id;
                document.getElementById('pasteTitle').value = paste.title;
                document.getElementById('pasteContent').value = paste.content;
                window.scrollTo({top:0,behavior:'smooth'});
            };
            document.getElementById('viewerClose').onclick = () => {
                document.getElementById('pasteViewer').classList.add('hidden');
                location.hash = '';
            };
        }
function openPaste(id) {
            id = decodeURIComponent(id);
            const paste = pastes.find(p => p.id === id);
            if (!paste) return;
            currentPasteId = id;
            configureViewer(paste);
            document.getElementById('rawViewer').classList.add('hidden');
            document.getElementById('pasteViewer').classList.remove('hidden');
            history.replaceState(null,'',location.pathname + location.search + '#/' + encodeURIComponent(id));
            document.getElementById('pasteViewer').scrollIntoView({behavior:'smooth',block:'start'});
        }
function renderRoute() {
            const route = decodeURIComponent(location.hash.slice(1));
            const raw = route.match(/^\/raw\/(.+)$/);
            const view = route.match(/^\/(.+)$/);
            document.getElementById('pasteViewer').classList.add('hidden');
            document.getElementById('rawViewer').classList.add('hidden');
            if (raw) {
                const paste = pastes.find(p => p.id === raw[1]);
                document.getElementById('rawCode').textContent = paste ? paste.content : 'Paste not found in this browser storage.';
                document.getElementById('rawViewer').classList.remove('hidden');
                document.getElementById('rawBack').onclick = () => paste ? openPaste(paste.id) : (location.hash = '');
            } else if (view) {
                const paste = pastes.find(p => p.id === view[1]);
                if (paste) {
                    configureViewer(paste);
                    document.getElementById('pasteViewer').classList.remove('hidden');
                    currentPasteId = paste.id;
                }
            }
        }
window.addEventListener('hashchange', renderRoute);
window.addEventListener('DOMContentLoaded', () => {
loadPasteList();
renderRoute();
initParticles();
animateParticles();
});

</script>
</body>
</html>
