
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRONWALL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#eee;font:14px monospace}
header{padding:24px 5%;border-bottom:1px solid #292929;letter-spacing:5px;font-size:20px}
main{width:90%;max-width:1100px;margin:55px auto}
h1{letter-spacing:5px;font-size:34px}
.sub,.muted{color:#777;font-size:11px;letter-spacing:2px}
.layout{display:grid;grid-template-columns:1fr 300px;gap:22px;margin-top:35px}
.panel{background:#0b0b0b;border:1px solid #292929;padding:22px;min-width:0}
.pt{border-bottom:1px solid #292929;padding-bottom:15px;margin-bottom:20px}
label{display:block;color:#888;margin:17px 0 8px;font-size:11px}
input,textarea{width:100%;padding:13px;background:#050505;color:#eee;border:1px solid #333;font:13px monospace}
textarea{min-height:300px;resize:vertical}
button{padding:11px 14px;background:#eee;color:#050505;border:1px solid #eee;font:bold 11px monospace;cursor:pointer}
button:hover{background:#050505;color:#eee}
.alt{background:transparent;color:#eee;border-color:#444}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
#message{color:#aaa;margin-top:15px;font-size:11px;overflow-wrap:anywhere}
.item{padding:13px 0;border-bottom:1px solid #292929}
.item-title{overflow-wrap:anywhere;margin-bottom:7px}
.meta{color:#777;font-size:10px}
.item-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.item-actions button{padding:7px 9px}
.empty{color:#777;font-size:12px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
a{color:white}
@media(max-width:750px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>IRONWALL</header>
<main>
<h1>PASTE STORAGE</h1>
<div class="sub">CREATE // STORE // SHARE // RAW</div>

<div class="layout">
<section class="panel">
<div class="pt">PASTE EDITOR</div>
<label>TITLE</label>
<input id="title" maxlength="160" placeholder="Untitled">
<label>CONTENT</label>
<textarea id="content" placeholder="Enter your text..."></textarea>
<div class="actions">
<button id="save">SAVE PASTE</button>
<button class="alt" id="new">NEW</button>
</div>
<div id="message"></div>
</section>

<aside class="panel">
<div class="pt">RECENT PASTES</div>
<div id="list"><div class="empty">Loading...</div></div>
<div class="actions"><button class="alt" id="refresh">REFRESH</button></div>
</aside>
</div>
</main>

<script>
const API="https://pastebin.lvlyvcbcla.workers.dev";
const $=id=>document.getElementById(id);
let currentId=null;

async function request(path,options={}){
 const response=await fetch(API+path,{
  ...options,
  headers:{
   ...(options.body?{"Content-Type":"application/json"}:{}),
   ...options.headers
  }
 });
 const text=await response.text();
 let data;
 try{data=text?JSON.parse(text):{}}
 catch{throw new Error("Invalid response from Worker")}
 if(!response.ok)throw new Error(data.error||"HTTP "+response.status);
 return data;
}

function say(text){$("message").textContent=text}
function reset(){
 currentId=null;
 $("title").value="";
 $("content").value="";
 say("");
}

async function save(){
 const content=$("content").value;
 if(!content.trim()){say("ERROR: Empty paste");return}
 const btn=$("save");
 btn.disabled=true;
 btn.textContent="SAVING...";
 try{
  const result=await request("/api/pastes",{
   method:"POST",
   body:JSON.stringify({
    id:currentId,
    title:$("title").value.trim()||"Untitled",
    content
   })
  });
  currentId=result.id;
  say("SAVED: "+result.id+" | RAW: "+result.raw);
  await load();
 }catch(e){say("SAVE ERROR: "+e.message)}
 finally{btn.disabled=false;btn.textContent="SAVE PASTE"}
}

function action(label,callback){
 const b=document.createElement("button");
 b.className="alt";
 b.textContent=label;
 b.onclick=callback;
 return b;
}

async function load(){
 $("list").replaceChildren();
 try{
  const pastes=await request("/api/pastes");
  if(!pastes.length){
   const e=document.createElement("div");
   e.className="empty";
   e.textContent="No pastes stored.";
   $("list").append(e);
   return;
  }
  for(const p of pastes){
   const item=document.createElement("div");
   item.className="item";
   const name=document.createElement("div");
   name.className="item-title";
   name.textContent=p.title||"Untitled";
   const meta=document.createElement("div");
   meta.className="meta";
   meta.textContent="ID: "+p.id;
   const actions=document.createElement("div");
   actions.className="item-actions";

   actions.append(action("EDIT",()=>{
    currentId=p.id;
    $("title").value=p.title||"";
    $("content").value=p.content||"";
    say("Editing: "+p.id);
    window.scrollTo({top:0,behavior:"smooth"});
   }));

   actions.append(action("VIEW",()=>{
    location.href=API+"/p/"+encodeURIComponent(p.id);
   }));

   actions.append(action("RAW",()=>{
    window.open(API+"/raw/"+encodeURIComponent(p.id),"_blank","noopener");
   }));

   actions.append(action("DELETE",async()=>{
    if(!confirm("Delete this paste permanently?"))return;
    try{
     await request("/api/pastes/"+encodeURIComponent(p.id),{method:"DELETE"});
     if(currentId===p.id)reset();
     say("Deleted.");
     await load();
    }catch(e){say("DELETE ERROR: "+e.message)}
   }));

   item.append(name,meta,actions);
   $("list").append(item);
  }
 }catch(e){
  const err=document.createElement("div");
  err.className="empty";
  err.textContent="LOAD ERROR: "+e.message;
  $("list").append(err);
 }
}

$("save").onclick=save;
$("new").onclick=reset;
$("refresh").onclick=load;

load();
</script>
</body>
</html>
